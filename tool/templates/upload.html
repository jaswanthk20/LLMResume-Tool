<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <title>S2 Resume Processing Utility</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="upload-page flex-center">
    <div class="center-card">
        <img src="{% static 'logo.png' %}" alt="S2 Logo" class="s2logo">
        <h1 class="s2-title">Resume Processing Utility</h1>
        <p class="desc">
            Submit a DOCX or PDF resume to receive a standardized S2-format Word document.
        </p>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <label for="resume_file" class="form-label">Select a DOCX or PDF resume file:</label>
            <input type="file" id="resume_file" name="resume_file" accept=".pdf,.doc,.docx" required>
            <button type="submit">Upload and Inspect</button>
        </form>
    </div>
</body>
</html>
